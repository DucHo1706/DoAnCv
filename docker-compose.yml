version: '3.8'

services:
  # 1. AI Service (FastAPI Python)
  ai-service:
    build:
      context: ./Python
      dockerfile: Dockerfile
    container_name: recruitment_ai_service
    ports:
      - "8000:8000"
    environment:
      - CSHARP_API_URL=http://backend:8080/api
      # Truyền API keys từ file .env ở máy host vào container
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always

  # 2. Backend Service (.NET 8.0 Core Web API)
  backend:
    build:
      context: ./RecruitmentBackend
      dockerfile: Dockerfile
    container_name: recruitment_backend
    ports:
      - "5286:8080" # Cổng HTTP hỗ trợ truy cập trực tiếp từ máy host nếu cần
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - PythonAiApiUrl=http://ai-service:8000
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING:-Server=db43261.public.databaseasp.net; Database=db43261; User Id=db43261; Password=3Hb?Cz-5_W4m; Encrypt=True; TrustServerCertificate=True; MultipleActiveResultSets=True;}
      - Jwt__Key=${JWT_KEY:-ASMWrPAZ9dqo3oJE6qPtnNQgiFwfm5AVFVyKoTJO6NO}
      - EmailSettings__Password=${EMAIL_PASSWORD:-dlvbuzxzgmxoryho}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME:-drirvdrsi}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY:-847779829538996}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET:-AAIhMXWpWhqMwBXUeuZc4QRZnZk}
    volumes:
      - ./Uploads:/app/Uploads
    depends_on:
      - ai-service
    restart: always

  # 3. Frontend Service (React + Nginx)
  frontend:
    build:
      context: ./ai-recruitment-frontend
      dockerfile: Dockerfile
    container_name: recruitment_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: always

volumes:
  # Cấu hình lưu trữ dữ liệu nếu cần
  uploads_data:
