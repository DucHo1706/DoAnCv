name: recruitment

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  ai-service:
    build:
      context: ./Python
      dockerfile: Dockerfile
    image: recruitment-ai:latest
    environment:
      CSHARP_API_URL: http://backend:8080/api
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Missing GEMINI_API_KEY}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      GEMINI_VISION_MODELS: ${GEMINI_VISION_MODELS:-gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      GEMINI_KEY_COOLDOWN_SECONDS: ${GEMINI_KEY_COOLDOWN_SECONDS:-60}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: ${AI_MEMORY_LIMIT:-2g}
    cpus: ${AI_CPU_LIMIT:-1.5}
    pids_limit: 256
    logging: *default-logging
    networks:
      - internal

  backend:
    build:
      context: ./RecruitmentBackend
      dockerfile: Dockerfile
    image: recruitment-backend:latest
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      PythonAiApiUrl: http://ai-service:8000
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING:?Missing DB_CONNECTION_STRING}
      Jwt__Key: ${JWT_KEY:?Missing JWT_KEY}
      EmailSettings__Password: ${EMAIL_PASSWORD:?Missing EMAIL_PASSWORD}
      EmailSettings__SenderEmail: ${EMAIL_ADDRESS:?Missing EMAIL_ADDRESS}
      EmailSettings__Username: ${EMAIL_ADDRESS:?Missing EMAIL_ADDRESS}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:?Missing CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:?Missing CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:?Missing CLOUDINARY_API_SECRET}
    expose:
      - "8080"
    volumes:
      - ${UPLOADS_PATH:-./Uploads}:/app/Uploads
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    cpus: ${BACKEND_CPU_LIMIT:-1.0}
    pids_limit: 256
    logging: *default-logging
    networks:
      - internal

  frontend:
    build:
      context: ./ai-recruitment-frontend
      dockerfile: Dockerfile
    image: recruitment-frontend:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.5}
    pids_limit: 128
    logging: *default-logging
    networks:
      - internal

networks:
  internal:
    driver: bridge
