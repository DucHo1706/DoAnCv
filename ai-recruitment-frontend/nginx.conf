# Cấu hình Rate Limiting chống spam/DDoS cho toàn bộ hệ thống
limit_req_zone $binary_remote_addr zone=general_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ai_api:10m rate=20r/m;

server {
    listen 80;
    server_name recruitinsightai.com www.recruitinsightai.com localhost;

    # Neu co file cert thi phuc vu HTTPS hoac tra ve HTTP binh thuong
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=general_api burst=30 nodelay;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /ai-api/ {
        limit_req zone=ai_api burst=10 nodelay;
        proxy_pass http://ai-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    location /hubs/ {
        proxy_pass http://backend:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /Uploads/ {
        proxy_pass http://backend:8080/Uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        root /usr/share/nginx/html;
        expires max;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

server {
    listen 443 ssl;
    server_name recruitinsightai.com www.recruitinsightai.com localhost;

    ssl_certificate /etc/letsencrypt/live/recruitinsightai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recruitinsightai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
