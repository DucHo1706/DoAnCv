# Cấu hình Rate Limiting chống spam/DDoS cho toàn bộ hệ thống
limit_req_zone $binary_remote_addr zone=general_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ai_api:10m rate=20r/m;

server {
    listen 80;
    server_name recruitinsightai.com www.recruitinsightai.com localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy các API request sang Backend .NET (Giới hạn 60 req/phút, burst=30)
    location /api/ {
        limit_req zone=general_api burst=30 nodelay;
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy các API request trực tiếp sang Python AI Service (Giới hạn 20 req/phút, burst=10)
    location /ai-api/ {
        limit_req zone=ai_api burst=10 nodelay;
        proxy_pass http://ai-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Proxy các kết nối SignalR Realtime sang Backend .NET
    location /hubs/ {
        proxy_pass http://backend:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy các file CV Uploads sang Backend .NET
    location /Uploads/ {
        proxy_pass http://backend:8080/Uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cấu hình cache cho các tài nguyên tĩnh
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        root /usr/share/nginx/html;
        expires max;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
