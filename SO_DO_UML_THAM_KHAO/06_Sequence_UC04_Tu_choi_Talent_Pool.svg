middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="888" dy="0">8. Gửi thông báo và email</tspan></text><rect x="1434" y="717" width="12" height="36" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><line x1="612" y1="725" x2="1440" y2="725" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><text x="1026" y="713" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="1026" dy="0">9. Phát trạng thái mới</tspan></text><line x1="336" y1="795" x2="60" y2="795" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#returnArrow)"/><text x="198" y="783" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="198" dy="0">10. Trả kết quả xử lý</tspan></text><rect x="38" y="640" width="1424" height="52" fill="#FFF7ED" fill-opacity="0.72" stroke="#F59E0B" stroke-width="2"/><path d="M 38 640 H 112 L 96 665 H 38 Z" fill="#F59E0B"/><text x="68" y="657" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF"><tspan x="68" dy="0">alt</tspan></text><text x="122" y="670" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="650" fill="#0F172A"><tspan x="122" dy="0">[điều kiện] Nếu gửi email lỗi: giữ kết quả từ chối đã commit, ghi log lỗi và cho phép gửi lại</tspan></text></svg>