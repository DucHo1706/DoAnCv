arrow)"/><text x="144" y="1354" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="144" dy="0">18. Clone preview, reset</tspan><tspan x="144" dy="14">zoom/frame và html2pdf.save()</tspan></text><rect x="606" y="1417" width="12" height="36" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><line x1="1440" y1="1425" x2="612" y2="1425" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><text x="1026" y="1413" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="1026" dy="0">19. GET /candidate-cvs</tspan></text><rect x="1158" y="1487" width="12" height="36" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><line x1="612" y1="1495" x2="1164" y2="1495" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><text x="888" y="1483" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="888" dy="0">20. SELECT CV thuộc CandidateId</tspan></text><line x1="1164" y1="1565" x2="1440" y2="1565" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#returnArrow)"/><text x="1302" y="1553" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="1302" dy="0">21. Trả CV mặc định và CV đã lưu</tspan></text><rect x="606" y="1627" width="12" height="36" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><line x1="1440" y1="1635" x2="612" y2="1635" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><text x="1026" y="1616" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="1026" dy="0">22. POST apply với</tspan><tspan x="1026" dy="14">SavedCvId/default/file mới</tspan></text><rect x="1158" y="1697" width="12" height="36" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><line x1="612" y1="1705" x2="1164" y2="1705" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><text x="888" y="1686" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="888" dy="0">23. Kiểm tra ownership và tải nội</tspan><tspan x="888" dy="14">dung tệp</tspan></text><rect x="1158" y="1767" width="12" height="36" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><line x1="612" y1="1775" x2="1164" y2="1775" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><text x="888" y="1756" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="888" dy="0">24. Tạo CandidateCV/Application và</tspan><tspan x="888" dy="14">gọi UC-02</tspan></text><rect x="38" y="780" width="1424" height="52" fill="#FFF7ED" fill-opacity="0.72" stroke="#F59E0B" stroke-width="2"/><path d="M 38 780 H 112 L 96 805 H 38 Z" fill="#F59E0B"/><text x="68" y="797" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF"><tspan x="68" dy="0">alt</tspan></text><text x="122" y="810" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="650" fill="#0F172A"><tspan x="122" dy="0">[điều kiện] Chưa đăng nhập hoặc validation lỗi: giữ localStorage, không gọi API lưu tài khoản</tspan></text><rect x="38" y="1124" width="1424" height="52" fill="#FFF7ED" fill-opacity="0.72" stroke="#F59E0B" stroke-width="2"/><path d="M 38 1124 H 112 L 96 1149 H 38 Z" fill="#F59E0B"/><text x="68" y="1141" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF"><tspan x="68" dy="0">alt</tspan></text><text x="122" y="1154" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="650" fill="#0F172A"><tspan x="122" dy="0">[điều kiện] API lưu lỗi: không xóa bản nháp; thông báo người dùng thử lại</tspan></text><rect x="38" y="1818" width="1424" height="52" fill="#FFF7ED" fill-opacity="0.72" stroke="#F59E0B" stroke-width="2"/><path d="M 38 1818 H 112 L 96 1843 H