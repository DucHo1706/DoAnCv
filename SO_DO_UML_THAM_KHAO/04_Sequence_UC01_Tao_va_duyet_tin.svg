" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="696" dy="0">8. Xác thực Recruiter, quyền</tspan><tspan x="696" dy="14">chi nhánh và dữ liệu</tspan></text><rect x="606" y="717" width="12" height="36" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><path d="M 612 725 H 684 V 755 H 619" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="696" y="724" text-anchor="start" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="696" dy="0">9. Kiểm tra tiêu chí, trọng</tspan><tspan x="696" dy="14">số, lương và deadline</tspan></text><rect x="882" y="787" width="12" height="36" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><line x1="612" y1="795" x2="888" y2="795" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><text x="750" y="783" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="750" dy="0">10. BEGIN TRANSACTION</tspan></text><rect x="882" y="857" width="12" height="36" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><line x1="612" y1="865" x2="888" y2="865" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><text x="750" y="846" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="750" dy="0">11. INSERT</tspan><tspan x="750" dy="14">JobPosting(Status=Pending)</tspan></text><rect x="882" y="927" width="12" height="36" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><line x1="612" y1="935" x2="888" y2="935" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><text x="750" y="923" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#0F172A"><tspan x="750" dy="0">12. INSERT toàn bộ JobCriteria</tspan></text><rect x="882" y="997" width="12" height="36" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/><line x1="612" y1="1005" x2="888" y2="1005" stroke="#334155" s